<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .section {
      background:#F2F3FD; 
      border:1.5px solid #B8BCEC; 
      border-radius:14px; 
      padding:28px 36px; 
      text-align:center;
    }
    .section .section-title {
      display:inline-block;
      background:#B8BCEC;
      color:#FFFFFF;
      font-weight:700;
      font-size:16px;
      letter-spacing:.08em;
      padding:6px 22px;
      border-radius:6px;
      margin-bottom:18px;
    }
    .section .part1 {
      background:#FFFFFF;
      border:1px solid rgba(107,112,200,0.18);
      border-radius:8px;
      padding:16px 20px;
    }
    .part1 .part-title {
      font-weight:700;
      color:#4A50A8;
      font-size:13px;
      margin-bottom:8px;
    }
    .part1 .part-sub {
      font-size:12.5px;
      color:#252558;
      line-height:2;
    }

    .wrapper { display: flex; flex-direction: column; }
    
    .tab {
      cursor: pointer; 
      padding: 10px 20px; 
      margin: 0px 2px; 
      display: inline-block; 
      border-radius: 6px;
      opacity: 0.6; /* 비활성화 탭 투명도 */
      transition: 0.2s;
    }

    .panels { margin: 10px 0; }
    
    .panel { display: none; }
    
    .panel-title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .radio { display: none; } /* 체크박스 숨기기 */

    /* 탭 선택 시 화면 표시 및 버튼 스타일 변경 */
    #SD1:checked ~ .tabs #SD1-tab,
    #SD2:checked ~ .tabs #SD2-tab,
    #LD:checked ~ .tabs #LD-tab {
      opacity: 1;
      background: #4A50A8; /* 선택된 탭 강조 색상 */
    }

    #SD1:checked ~ .panels #SD1-panel,
    #SD2:checked ~ .panels #SD2-panel,
    #LD:checked ~ .panels #LD-panel {
      display: block;
    }
  </style>

  <script>
    function sendHeight() {
      var height = document.documentElement.scrollHeight || document.body.scrollHeight;
      window.parent.postMessage({ frameHeight: height }, '*');
    }

    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);

    document.addEventListener('click', function() {
      setTimeout(sendHeight, 100);
    });
  </script>
</head>
<body>

  <!-- 1. 주의사항 -->
  <div style="max-width:1280px; margin:48px auto 28px; padding:0 5%;">
    <div class="section">
      <div class="section-title">주의사항</div>
      <div class="part1" style="margin-bottom: 12px;">
        <div class="part-title">내보내기 데이터(moc3)의 판매입니다.</div>
        <div class="part-sub">완성된 cmo3 파일은 제공하지 않습니다.</div>
      </div>
      <div class="part1" style="margin-bottom: 12px;">
        <div class="part-title">작업물은 작가의 샘플로서 포트폴리오로 기재될 수 있습니다.</div>
        <div class="part-sub">작업물 공개일 조정이 필요할 경우 해당 작업 마무리 전 문의 바랍니다.</div>
      </div>
      <div class="part1">
        <div class="part-title">본 상품은 디지털 콘텐츠로, 환불 및 교환이 불가합니다.</div>
        <div class="part-sub">예약 후 환불의 경우 90%, 작업 시작 후 환불은 아래 참조 부탁드립니다.</div>
      </div>
    </div>
  </div>

  <!-- 2. 상세 설명 (탭 영역) -->
  <div style="max-width:1280px; margin:0 auto 80px; padding:0 5%;">
    <div class="wrapper section">
      
      <!-- 라디오 버튼 (ID와 for값이 일치해야 함) -->
      <input class="radio" type="radio" name="group" id="SD1">
      <input class="radio" type="radio" name="group" id="SD2">
      <input class="radio" type="radio" name="group" id="LD" checked>

      <!-- 탭 버튼들 -->
      <div class="tabs">
        <label class="tab section-title" id="SD1-tab" for="SD1">SD simple</label>
        <label class="tab section-title" id="SD2-tab" for="SD2">SD basic</label>
        <label class="tab section-title" id="LD-tab" for="LD">LD basic</label>
      </div>

      <!-- 패널 콘텐츠 -->
      <div class="panels part1">
        <div class="panel" id="SD1-panel">
          <div class="panel-title">첫번째 (SD simple)</div>
          <p>첫번째 탭 내용입니다.</p>
        </div>
        <div class="panel" id="SD2-panel">
          <div class="panel-title">두번째 (SD basic)</div>
          <p>두번째 탭 내용입니다.</p>
        </div>
        <div class="panel" id="LD-panel">
          <div class="panel-title">세번째 (LD basic)</div>
          <p>세번째 탭 내용입니다.</p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
